    salvocortesiano.forumhealth.tables.link_occurrences: '%core.table_prefix%fh_link_occurrences'
    salvocortesiano.forumhealth.tables.alerts: '%core.table_prefix%fh_alerts'
    salvocortesiano.forumhealth.tables.metrics_history: '%core.table_prefix%fh_metrics_history'
    salvocortesiano.forumhealth.tables.rules: '%core.table_prefix%fh_rules'
    salvocortesiano.forumhealth.tables.ai_cache: '%core.table_prefix%fh_ai_cache'
    salvocortesiano.forumhealth.tables.jobs: '%core.table_prefix%fh_jobs'
